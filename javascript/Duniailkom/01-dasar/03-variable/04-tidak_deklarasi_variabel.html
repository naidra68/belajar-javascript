<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tidak Deklarasi Variabel - Javascript</title>
</head>
<body>
    <h1>Tidak Deklarasi Variabel</h1>
    <script>
        angka = 1234;
        console.log(angka); // 1234

        nama = "Joe Koe Wie";
        console.log(nama); // Joe Koe Wie
    </script>
</body>
</html>
