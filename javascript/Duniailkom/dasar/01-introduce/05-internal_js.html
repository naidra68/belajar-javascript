<html>
<head>
    <title>Internal Javascript - Javascript</title>
</head>
<body>
    <button id="myClick">Klik Disini!</button>
    <h1 id="H1"></h1>
    <script>
        document.getElementById('myClick').addEventListener("click", () => document.getElementById('H1').innerHTML='Hello World');
    </script>
</body>
</html>
